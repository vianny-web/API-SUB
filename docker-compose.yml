
services:
  subscription-api:
    build: .
    container_name: subscription-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
